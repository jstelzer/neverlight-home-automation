appname = casdoor
httpport = 8000
runmode = prod

# SQLite database (stored in /data volume for persistence)
driverName = sqlite
dataSourceName = file:/data/casdoor.db?cache=shared
dbName = casdoor

# Session management
SessionOn = true
copyrequestbody = true

# Origin URL - how Casdoor is accessed externally
# This must match the URL users/applications use to reach Casdoor
origin = https://casdoor.neverlight.local:8443

# Static files
staticDir = web/build

# Logging
logPath = /data/logs

# Initial admin credentials (change after first login!)
# These are only used for first-time setup
initDataFile = /conf/init_data.json
