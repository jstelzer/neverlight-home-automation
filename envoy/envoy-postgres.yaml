# Envoy sidecar for Postgres
# Terminates mTLS, proxies to postgres on localhost
#
# Two identity planes:
#   Port 5432: Workload identity (SPIRE SVIDs)
#              SPIFFE ID: spiffe://neverlight.local/workload/postgres
#              Authorized callers: other workloads with valid SVIDs
#
#   Port 5433: Human identity (step-ca client certs)
#              For operators using psql, DBeaver, DataGrip, etc.
#              Authorized callers: anyone with valid step-ca client cert

node:
  id: postgres-sidecar
  cluster: postgres

static_resources:
  listeners:
    # Workload identity listener (SPIRE SVIDs)
    - name: workload_mtls_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 5432
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: postgres_workload
                cluster: local_postgres
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: "spiffe://neverlight.local/workload/postgres"
                    sds_config:
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                validation_context_sds_secret_config:
                  name: "spiffe://neverlight.local"
                  sds_config:
                    api_config_source:
                      api_type: GRPC
                      transport_api_version: V3
                      grpc_services:
                        - envoy_grpc:
                            cluster_name: spire_agent

    # Human identity listener (step-ca client certs)
    # Connect with: psql "host=localhost port=5433 sslmode=verify-full \
    #                     sslcert=mental.crt sslkey=mental.key sslrootcert=root_ca.crt"
    - name: human_mtls_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 5433
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: postgres_human
                cluster: local_postgres
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /certs/server.crt
                    private_key:
                      filename: /certs/server.key
                validation_context:
                  trusted_ca:
                    filename: /certs/root_ca.crt

  clusters:
    # Local postgres (no TLS, same network namespace via localhost)
    - name: local_postgres
      connect_timeout: 5s
      type: STATIC
      load_assignment:
        cluster_name: local_postgres
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 5432

    # SPIRE Agent for SDS
    - name: spire_agent
      connect_timeout: 5s
      type: STATIC
      http2_protocol_options: {}
      load_assignment:
        cluster_name: spire_agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe:
                      path: /tmp/spire-agent/public/api.sock

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
