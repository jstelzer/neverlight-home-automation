# Envoy sidecar for Lobehub
# - Inbound: terminates mTLS from other workloads
# - Outbound: initiates mTLS to Ollama
#
# SPIFFE ID: spiffe://neverlight.local/workload/lobehub

node:
  id: lobehub-sidecar
  cluster: lobehub

static_resources:
  listeners:
    # Outbound proxy - lobehub connects here to reach ollama
    # Lobehub → localhost:11434 → this listener → mTLS → ollama-sidecar
    - name: ollama_egress
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 11434
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ollama_egress
                route_config:
                  name: ollama_route
                  virtual_hosts:
                    - name: ollama
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: ollama_mtls
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # Ollama via mTLS (through ollama's sidecar)
    - name: ollama_mtls
      connect_timeout: 30s
      type: STRICT_DNS
      load_assignment:
        cluster_name: ollama_mtls
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: envoy-ollama
                      port_value: 11434
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_certificate_sds_secret_configs:
              - name: "spiffe://neverlight.local/workload/lobehub"
                sds_config:
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                      - envoy_grpc:
                          cluster_name: spire_agent
            validation_context_sds_secret_config:
              name: "spiffe://neverlight.local"
              sds_config:
                api_config_source:
                  api_type: GRPC
                  transport_api_version: V3
                  grpc_services:
                    - envoy_grpc:
                        cluster_name: spire_agent

    # SPIRE Agent for SDS
    - name: spire_agent
      connect_timeout: 5s
      type: STATIC
      http2_protocol_options: {}
      load_assignment:
        cluster_name: spire_agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe:
                      path: /tmp/spire-agent/public/api.sock

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
