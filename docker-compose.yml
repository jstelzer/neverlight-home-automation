services:
  # =============================================================================
  # SPIRE - Workload Identity
  # =============================================================================
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.0
    hostname: spire-server
    networks:
      - spire
    volumes:
      - ./spire/server/server.conf:/opt/spire/conf/server/server.conf:ro
      - ./spire/server/data:/opt/spire/data/server
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.0
    hostname: spire-agent
    networks:
      - spire
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - ./spire/agent/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./spire/agent/data:/opt/spire/data/agent
      - ./spire/agent/socket:/tmp/spire-agent/public
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Envoy Sidecars - mTLS enforcement layer
  # Each sidecar owns its network namespace; workload shares it via network_mode
  # =============================================================================

  # Postgres sidecar - terminates mTLS, proxies to postgres
  # Two identity planes:
  #   Port 5432: Workload identity (SPIRE SVIDs) - for service-to-service
  #   Port 5433: Human identity (step-ca certs) - for psql, DBeaver, etc.
  envoy-postgres:
    image: envoyproxy/envoy:v1.28-latest
    hostname: envoy-postgres
    networks:
      - postgres
    volumes:
      - ./envoy/envoy-postgres.yaml:/etc/envoy/envoy.yaml:ro
      - ./spire/agent/socket:/tmp/spire-agent/public:ro
      - ./certs:/certs:ro  # step-ca certs for human identity listener
    labels:
      - "spiffe.io/workload=postgres"
    depends_on:
      spire-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9901/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "5432:5432"  # Workload mTLS (SPIRE SVIDs)
      - "5433:5433"  # Human mTLS (step-ca certs)
    restart: unless-stopped

  # Ollama sidecar - terminates mTLS, proxies to ollama
  # Port 11434: mTLS listener for workload-to-workload (SPIRE SVIDs)
  # Port 11435: Plaintext listener for Caddy (human identity via step-ca)
  envoy-ollama:
    image: envoyproxy/envoy:v1.28-latest
    hostname: envoy-ollama
    networks:
      - gateway   # Caddy connects here (plaintext :11435)
      - workload  # envoy-lobehub connects here (mTLS :11434)
    volumes:
      - ./envoy/envoy-ollama.yaml:/etc/envoy/envoy.yaml:ro
      - ./spire/agent/socket:/tmp/spire-agent/public:ro
    labels:
      - "spiffe.io/workload=ollama"
    depends_on:
      spire-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9901/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    expose:
      - "11434"  # mTLS (workload)
      - "11435"  # Plaintext (Caddy)
    restart: unless-stopped

  # Lobehub sidecar - egress mTLS to ollama via SPIRE SVIDs
  # Port 3210: Lobehub app (shared network namespace) - Caddy connects here
  # Port 11434: Egress listener - lobehub's ollama requests go through here
  envoy-lobehub:
    image: envoyproxy/envoy:v1.28-latest
    hostname: envoy-lobehub
    networks:
      - gateway   # Caddy connects here (:3210)
      - workload  # Egress to envoy-ollama (:11434 mTLS)
    # Allow lobehub to reach external URLs (for OIDC token exchange)
    extra_hosts:
      - "casdoor.neverlight.local:host-gateway"
      - "lobehub.neverlight.local:host-gateway"
    volumes:
      - ./envoy/envoy-lobehub.yaml:/etc/envoy/envoy.yaml:ro
      - ./spire/agent/socket:/tmp/spire-agent/public:ro
    labels:
      - "spiffe.io/workload=lobehub"
    depends_on:
      spire-agent:
        condition: service_healthy
      envoy-ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9901/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    expose:
      - "3210"   # Lobehub app (Caddy connects here)
    restart: unless-stopped

  # =============================================================================
  # Workloads - share network namespace with their sidecars
  # =============================================================================

  postgres:
    image: postgres:latest
    network_mode: "service:envoy-postgres"
    # Bind to localhost only - envoy owns external ports 5432/5433
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      envoy-postgres:
        condition: service_healthy
    # No ports - only reachable via sidecar mTLS
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    network_mode: "service:envoy-ollama"
    volumes:
      - /home/mental/.ollama:/root/.ollama
    environment:
      NVIDIA_VISIBLE_DEVICES: "GPU-b04df65a-fa7f-44d8-6db2-6e8dea266ab8"
      OLLAMA_ORIGINS: "*"
      # Bind to localhost only - envoy owns external port 11434
      OLLAMA_HOST: "127.0.0.1:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "GPU-b04df65a-fa7f-44d8-6db2-6e8dea266ab8"
              capabilities: [gpu]
    depends_on:
      envoy-ollama:
        condition: service_healthy
    restart: unless-stopped

  lobehub:
    image: "lobehub/lobe-chat:latest"
    network_mode: "service:envoy-lobehub"
    volumes:
      # Trust our CA for OIDC calls to Casdoor
      - ./certs/root_ca.crt:/etc/ssl/certs/neverlight-ca.crt:ro
    environment:
      # Points to local sidecar egress listener (shared network namespace)
      OLLAMA_PROXY_URL: "http://127.0.0.1:11434"
      # Trust our CA for Node.js HTTPS calls
      NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/neverlight-ca.crt"
      # NextAuth configuration for OIDC
      NEXT_AUTH_SECRET: "${NEXT_AUTH_SECRET}"
      NEXTAUTH_URL: "https://lobehub.neverlight.local:9444"
      # Casdoor OIDC provider
      NEXT_AUTH_SSO_PROVIDERS: "casdoor"
      AUTH_CASDOOR_ID: "${AUTH_CASDOOR_ID}"
      AUTH_CASDOOR_SECRET: "${AUTH_CASDOOR_SECRET}"
      # External URL for OIDC (matches token issuer claim)
      AUTH_CASDOOR_ISSUER: "https://casdoor.neverlight.local:8443"
    depends_on:
      envoy-lobehub:
        condition: service_healthy
    restart: unless-stopped

  # =============================================================================
  # Identity - Casdoor OIDC Provider
  # =============================================================================
  casdoor:
    image: casbin/casdoor:latest
    hostname: casdoor
    networks:
      gateway:
        # Alias so other containers can reach it as casdoor.neverlight.local
        aliases:
          - casdoor.neverlight.local
    environment:
      # Use SQLite for simplicity (file stored in volume)
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./casdoor/conf:/conf:ro
      - casdoor_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Gateway - Human access (step-ca mTLS)
  # =============================================================================
  caddy:
    image: caddy:latest
    networks:
      - gateway  # Only network Caddy can reach - envoy sidecars
    ports:
      - "9443:9443"   # Ollama via Caddy (human mTLS)
      - "9444:9444"   # Lobehub via Caddy (OIDC, no client cert)
      - "8443:8443"   # Casdoor via Caddy (OIDC login UI)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      envoy-ollama:
        condition: service_healthy
      envoy-lobehub:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    restart: unless-stopped

  # One-time model pull (keep for convenience)
  ollama-pull-llama:
    image: ollama/ollama:latest
    container_name: ollama-pull-llama
    network_mode: "service:envoy-ollama"
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    entrypoint: /bin/sh
    command:
      - "-c"
      - "sleep 5; OLLAMA_HOST=127.0.0.1:11434 ollama pull llama3.2"
    depends_on:
      - ollama

volumes:
  caddy_data:
  caddy_config:
  casdoor_data:

networks:
  # SPIRE internal communication (server ↔ agent)
  spire:
    internal: true

  # Human access via Caddy (step-ca mTLS)
  # Caddy → envoy sidecars (plaintext listeners)
  gateway:
    internal: true

  # Workload-to-workload mTLS (SPIRE SVIDs)
  # envoy-lobehub → envoy-ollama
  workload:
    internal: true

  # Postgres access (local abyss, EC2 POC)
  # Isolated - only envoy-postgres lives here
  postgres:
    internal: true
