services:
  # mTLS Gateway
  caddy:
    image: caddy:latest
    ports:
      - "9443:9443"   # Ollama mTLS
      - "9444:9444"   # Lobehub mTLS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ollama
      - lobehub
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # No external ports - only accessible via Caddy
    expose:
      - "11434"
    volumes:
      - /home/mental/.ollama:/root/.ollama
    environment:
      NVIDIA_VISIBLE_DEVICES: "GPU-b04df65a-fa7f-44d8-6db2-6e8dea266ab8"
      OLLAMA_ORIGINS: "*"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "GPU-b04df65a-fa7f-44d8-6db2-6e8dea266ab8"
              capabilities: [gpu]
    restart: unless-stopped

  ollama-pull-llama:
    image: ollama/ollama:latest
    container_name: ollama-pull-llama
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    entrypoint: /bin/sh
    command:
      - "-c"
      - "sleep 3; OLLAMA_HOST=ollama:11434 ollama pull llama3.2; "
    depends_on:
      - ollama

  lobehub:
    image: "lobehub/lobe-chat:latest"
    # No external ports - only accessible via Caddy
    expose:
      - "3210"
    environment:
      ACCESS_CODE: "lobe123"  # Change this to your preferred password
      OLLAMA_PROXY_URL: "http://ollama:11434"
    depends_on:
      - ollama

volumes:
  caddy_data:
  caddy_config:
